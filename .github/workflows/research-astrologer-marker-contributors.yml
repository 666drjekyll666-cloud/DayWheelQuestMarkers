name: Build Astrologer marker contributor probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: day-wheel-astrologer-marker-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore research/AstrologerMarkerContributorsProbe/AstrologerMarkerContributorsProbe.csproj --configfile nuget.config

      - name: Build Release DLL
        run: dotnet build research/AstrologerMarkerContributorsProbe/AstrologerMarkerContributorsProbe.csproj -c Release --no-restore

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'research/AstrologerMarkerContributorsProbe/bin/Release/DayWheelAstrologerMarkerContributorsProbe.dll' 'dist/DayWheelQuestMarkers-astrologer-marker-contributors-probe-0.1.0.dll'
          $hash = (Get-FileHash 'dist/DayWheelQuestMarkers-astrologer-marker-contributors-probe-0.1.0.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Astrologer marker contributor probe SHA-256: $hash"

      - name: Upload probe DLL
        uses: actions/upload-artifact@v4
        with:
          name: DayWheelAstrologerMarkerContributorsProbe-0.1.0
          path: dist/DayWheelQuestMarkers-astrologer-marker-contributors-probe-0.1.0.dll
          if-no-files-found: error
          retention-days: 7
