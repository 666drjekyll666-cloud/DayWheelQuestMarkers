name: Validate interaction universe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dev/**'
      - 'research/**'
    paths:
      - 'validator/**'
      - 'src/WeekdayInteractionRuleCache.cs'
      - 'src/NavigationReachabilityCache.cs'
      - 'src/UnifiedDialogueLifecycleCompiler.cs'
      - 'src/PersistentRuleManifest.cs'
      - 'src/VerifiedCompletionReminderRules.cs'
      - 'src/CalendarQuestsPinsPlugin.cs'
      - '.github/workflows/validate-interaction-universe.yml'
  pull_request:
    paths:
      - 'validator/**'
      - 'src/WeekdayInteractionRuleCache.cs'
      - 'src/NavigationReachabilityCache.cs'
      - 'src/UnifiedDialogueLifecycleCompiler.cs'
      - 'src/PersistentRuleManifest.cs'
      - 'src/VerifiedCompletionReminderRules.cs'
      - 'src/CalendarQuestsPinsPlugin.cs'
      - '.github/workflows/validate-interaction-universe.yml'

permissions:
  contents: read

concurrency:
  group: interaction-universe-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate accepted interaction universe
        run: python validator/validate_interaction_universe.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-universe-report
          path: validator/out/validation-report.json
          if-no-files-found: warn
          retention-days: 14
